[project]
name = "ag2-examples"
version = "0.1.0"
description = "AG2 framework examples"
requires-python = ">=3.12"
dependencies = [
    "ag2[openai,mcp,a2a,acp,metrics]>=1.0.1",
    # A2AServer needs http-server; ag2 1.0.1's a2a/server.py also imports the
    # gRPC transport unconditionally, so grpc is required even for JSON-RPC.
    "a2a-sdk[http-server,grpc]",
    "mcp",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "uvicorn",
]
